<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduConnect Navigator - Trouvez votre école</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="src/css/styles.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  </head>
  <body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-lg">
      <div
        class="container mx-auto px-4 py-4 flex justify-between items-center"
      >
        <div class="flex items-center space-x-2">
          <i data-feather="book-open" class="w-8 h-8"></i>
          <h1 class="text-2xl font-bold">EduConnect Navigator</h1>
        </div>
        <nav>
          <ul class="flex space-x-6">
            <li>
              <a href="#" class="hover:text-indigo-200 font-medium">Accueil</a>
            </li>
            <li>
              <a href="#contact" class="hover:text-indigo-200 font-medium"
                >Contact</a
              >
            </li>
          </ul>
        </nav>
      </div>
    </header>
    <section
      class="bg-gradient-to-r from-indigo-500 to-purple-600 text-white py-16"
    >
      <div class="container mx-auto px-4 text-center">
        <h2 class="text-4xl font-bold mb-4">
          Trouvez l'établissement scolaire parfait
        </h2>
        <p class="text-xl mb-8 max-w-2xl mx-auto">
          Explorez les écoles, collèges et lycées de votre ville en un clic
        </p>
        <div class="relative max-w-md mx-auto">
          <input
            type="text"
            placeholder="Rechercher par ville..."
            class="w-full py-3 px-4 rounded-full text-gray-800 focus:outline-none focus:ring-2 focus:ring-indigo-300"
          />
          <button
            class="absolute right-2 top-1/2 transform -translate-y-1/2 bg-indigo-700 text-white p-2 rounded-full hover:bg-indigo-800 transition"
          >
            <i data-feather="search"></i>
          </button>
        </div>
      </div>
    </section>
  </body>
</html>
